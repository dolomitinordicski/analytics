name: Deploy DNS Analytics to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Foundation before installation
        run: node scripts/foundation-lock.mjs
      - run: npm ci --no-audit --no-fund
      - name: Verify installed Foundation
        run: node scripts/foundation-lock.mjs --installed
      - run: npm run check:parity
      - run: npm run check:zero-loss
      - run: npm run check:bilingual
      - run: npm run check:references
      - run: npm run build
      - name: Validate public Partner asset isolation
        run: node scripts/check-partner-bundle.mjs
      - name: Build isolated Partner distribution
        run: npm run build:partner
      - name: Check isolated Partner distribution
        run: npm run check:partner-assets
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Never upload dist: it still bundles historical internal datasets.
          path: ./dist-partner

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
